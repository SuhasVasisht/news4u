[project]
name = "news-collector"
version = "0.1.0"
description = "Daily news ingestion pipeline with collectors, normalization, ranking, and digest generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pillow>=11.0.0",
  "faster-whisper>=1.2.0",
  "youtube-transcript-api>=1.2.0",
  "feedparser>=6.0.11",
  "httpx>=0.27.2",
  "playwright>=1.54.0",
  "pydantic>=2.9.2",
  "python-dateutil>=2.9.0.post0",
  "pyyaml>=6.0.2",
  "rapidfuzz>=3.10.0",
  "selectolax>=0.3.26",
  "trafilatura>=1.12.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "respx>=0.22.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["news_collector*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "live: tests that hit live external services",
]

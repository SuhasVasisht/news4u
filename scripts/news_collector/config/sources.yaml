defaults:
  request_timeout_seconds: 20
  user_agent: "news-collector/0.1 (local development; contact@example.com)"
  output_dir: "output"
  db_path: "data/news_collector.db"
  gdelt_min_interval_seconds: 5
  sec_rate_limit_per_second: 2
  alpha_vantage_daily_limit: 25
  unofficial_initial_delay_seconds:
    min: 0
    max: 0

trust_scores:
  coverage_research: 0.8
  techcrunch: 0.86
  bbc_world: 0.9
  bbc_politics: 0.9
  guardian: 0.88
  hackernews: 0.72
  techmeme: 0.75
  arxiv_cs_ai: 0.8
  sec_press: 0.98
  ap_top_news: 0.93
  tldr_tech: 0.72
  tldr_ai: 0.72
  bytebytego: 0.8
  alphasignal: 0.72
  alphasignal_email: 0.72
  tldr_email: 0.72
  gdelt: 0.6
  alphavantage_news: 0.7
  alphavantage_movers: 0.82
  producthunt: 0.7
  reddit: 0.4
  newsapi: 0.65
  x_search: 0.45
  bbc_business: 0.9
  bbc_science: 0.9
  bbc_health: 0.9
  doj_antitrust: 0.96
  npr_business: 0.9
  al_jazeera: 0.86
  mhra_news: 0.98
  krebs_security: 0.9
  ecb_press: 0.98
  dol_claims: 0.98
  hawley_oversight: 0.75
  icc_news: 0.98
  ptc_news: 0.98
  chrobinson_news: 0.98

watchlists:
  tech_entities:
    - OpenAI
    - Anthropic
    - Nvidia
    - Google
    - Microsoft
    - Meta
    - Amazon
    - Apple
  finance_tickers:
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - GOOGL
    - META
    - TSLA
    - AMD

collectors:
  - name: coverage_research
    type: coverage_research
    enabled: true
    editorial_limit: 30
  - name: salesforce_news
    type: rss
    enabled: true
    category: tech
    edition_sector: Deals & regulation
    editorial_type: announcement
    url: https://www.salesforce.com/news/feed/
    limit: 4
    editorial_limit: 2
  - name: dol_claims
    type: dol_claims
    enabled: true
    category: finance
    edition_sector: Economy
    editorial_type: announcement
    url: https://www.dol.gov/ui/data.pdf
    editorial_limit: 1
  - name: hawley_oversight
    type: rss
    enabled: true
    category: politics
    edition_sector: Deals & regulation
    # Statements from one senator's office, not independent confirmation of allegations.
    editorial_type: announcement
    url: https://www.hawley.senate.gov/feed/
    limit: 4
    editorial_limit: 2
  - name: tldr_email
    type: newsletter_mail
    enabled: true
    enabled_env: NEWS_MAIL_ENABLED
    category: tech
    editorial_limit: 32
    sender_domains: [tldr.tech, tldrnewsletter.com]
    max_messages_per_run: 20
    lookback_days: 30
  - name: alphasignal_email
    type: newsletter_mail
    enabled: true
    enabled_env: NEWS_MAIL_ENABLED
    category: tech
    editorial_limit: 16
    sender_domains: [alphasignal.ai]
    max_messages_per_run: 20
    lookback_days: 30
  - name: techcrunch
    type: rss
    enabled: true
    category: tech
    url: https://techcrunch.com/feed/
  - name: bbc_world
    type: rss
    enabled: true
    category: world
    url: https://feeds.bbci.co.uk/news/world/rss.xml
  - name: bbc_politics
    type: rss
    enabled: true
    category: politics
    url: https://feeds.bbci.co.uk/news/politics/rss.xml
  - name: sec_press
    type: rss
    enabled: true
    category: finance
    url: https://www.sec.gov/rss/news/press.xml
    edition_sector: Deals & regulation
    editorial_type: announcement
  - name: mhra_news
    type: rss
    enabled: true
    category: tech
    edition_sector: Deals & regulation
    editorial_type: announcement
    url: https://www.gov.uk/government/organisations/medicines-and-healthcare-products-regulatory-agency.atom
    editorial_limit: 12
  - name: icc_news
    type: rss
    enabled: true
    category: world
    edition_sector: World
    editorial_type: announcement
    url: https://www.icc-cpi.int/rss/news/all
    limit: 20
    editorial_limit: 12
  - name: ptc_news
    type: newsroom
    enabled: true
    category: finance
    edition_sector: Deals & regulation
    editorial_type: announcement
    url: https://www.sec.gov/Archives/edgar/data/857005/000119312526413124/d174191dex991.htm
    single_article: true
    article_title: Schneider Electric to acquire PTC in $22.6 billion deal
    limit: 1
    editorial_limit: 1
  - name: chrobinson_news
    type: newsroom
    enabled: true
    category: finance
    edition_sector: Deals & regulation
    editorial_type: announcement
    url: https://www.sec.gov/Archives/edgar/data/1929561/000119312526413211/d115124d425.htm
    single_article: true
    article_title: C.H. Robinson to acquire RXO in $5.8 billion transaction
    max_chars: 60000
    limit: 1
    editorial_limit: 1
  - name: guardian
    type: guardian
    enabled: true
    category: world
    sections:
      - world
      - us-news
      - business
      - technology
    editorial_limit: 12
  - name: hackernews
    type: hackernews
    enabled: true
    category: tech
    limit: 20
    editorial_limit: 16
  - name: techmeme
    type: techmeme
    enabled: true
    category: tech
    url: https://www.techmeme.com/feed.xml
    editorial_limit: 16
  - name: arxiv_cs_ai
    type: rss
    enabled: true
    category: tech
    url: https://arxiv.org/rss/cs.AI
  - name: gdelt
    type: gdelt
    enabled: true
    category: world
    queries:
      - technology
      - ai OR semiconductor OR cloud
      - election OR sanctions OR parliament
  - name: alphavantage_news
    type: alphavantage_news
    enabled: true
    category: finance
    editorial_limit: 64
    topics:
      - technology
      - financial_markets
      - mergers_and_acquisitions
  - name: alphavantage_movers
    type: alphavantage_movers
    enabled: true
    category: finance
  - name: tldr_tech
    type: tldr
    # Retained as a manual fallback; daily Tech and AI now arrive by email.
    enabled: false
    category: tech
    unofficial: true
    newsletter: tech
    url: https://tldr.tech/api/latest/tech
    daily_issue: true
    schedule_hours: 3
    max_items_per_run: 30
    editorial_limit: 16
  - name: tldr_ai
    type: tldr
    # Retained as a manual fallback; daily Tech and AI now arrive by email.
    enabled: false
    category: tech
    unofficial: true
    newsletter: ai
    url: https://tldr.tech/api/latest/ai
    daily_issue: true
    schedule_hours: 3
    max_items_per_run: 30
    editorial_limit: 16
  - name: bytebytego
    type: rss
    enabled: true
    category: tech
    editorial_type: analysis
    url: https://blog.bytebytego.com/feed
    limit: 10
  - name: alphasignal
    type: alphasignal
    enabled: true
    category: tech
    unofficial: true
    url: https://alphasignal.ai/
    schedule_hours: 3
    limit: 20
  - name: ap_top_news
    type: ap
    enabled: true
    category: world
    unofficial: true
    url: https://apnews.com/hub/apf-topnews
    schedule_hours: 2
    max_requests_per_run: 6
    min_request_delay_seconds: 6
    max_request_delay_seconds: 10
    cooldown_hours: 24
  - name: x_search
    type: x
    enabled: false
    category: tech
    unofficial: true
    mode: tracked_accounts
    schedule_hours: 4
    max_accounts_per_run: 5
    max_posts_per_account: 2
    hours_back: 24
    link_required: false
    cooldown_hours: 24
    human_initial_delay_seconds:
      min: 8
      max: 20
    min_account_delay_seconds: 12
    max_account_delay_seconds: 25
    min_scroll_delay_seconds: 1.5
    max_scroll_delay_seconds: 4
    scroll_count_min: 2
    scroll_count_max: 4
    scroll_pixels_min: 400
    scroll_pixels_max: 900
    query_filters:
      - OpenAI
      - Anthropic
      - Nvidia
      - semiconductor
      - datacenter
      - AI
    accounts:
      - OpenAI
      - AnthropicAI
      - GoogleDeepMind
      - nvidia
      - Microsoft
      - github
      - Cloudflare
      - vercel
      - TechCrunch
      - SECGov
  - name: producthunt
    type: producthunt
    enabled: false
    category: tech
    limit: 20
  - name: reddit
    type: reddit
    enabled: false
    category: tech
    unofficial: true
    schedule_hours: 6
    max_subreddits_per_run: 2
    max_posts_per_subreddit: 8
    subreddits:
      - MachineLearning
      - programming
      - selfhosted
  - name: newsapi
    type: newsapi
    enabled: true
    category: other
    queries:
      - technology
      - finance


services:
  proxy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_PASSWORD_HASH: ${BASIC_AUTH_PASSWORD_HASH}
    depends_on:
      web:
        condition: service_healthy

  web:
    build: .
    restart: unless-stopped
    command: ["sh", "/app/scripts/web-entrypoint.sh"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SYNC_API_KEY: ${SYNC_API_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      APP_TIMEZONE: ${APP_TIMEZONE}
      APP_DAILY_RESET_HOUR: ${APP_DAILY_RESET_HOUR}
      NEWS_COLLECTOR_DB_PATH: ${NEWS_COLLECTOR_DB_PATH}
      NEWS_COLLECTOR_OUTPUT_DIR: ${NEWS_COLLECTOR_OUTPUT_DIR}
      NEWS_COLLECTOR_SYNC_OUTBOX_DIR: ${NEWS_COLLECTOR_SYNC_OUTBOX_DIR}
      NEWS_COLLECTOR_USER_AGENT: ${NEWS_COLLECTOR_USER_AGENT}
      NEWS_COLLECTOR_X_PROFILE_DIR: ${NEWS_COLLECTOR_X_PROFILE_DIR}
      NEWS_COLLECTOR_REDDIT_PROFILE_DIR: ${NEWS_COLLECTOR_REDDIT_PROFILE_DIR}
      NEWS_APP_BASE_URL: ${NEWS_APP_BASE_URL}
      NEWS_APP_SYNC_API_KEY: ${NEWS_APP_SYNC_API_KEY}
      NEWS_APP_SYNC_BATCH_SIZE: ${NEWS_APP_SYNC_BATCH_SIZE}
      NEWS_COLLECTOR_REPLAY_BATCH_SIZE: ${NEWS_COLLECTOR_REPLAY_BATCH_SIZE}
      NEWSAPI_KEY: ${NEWSAPI_KEY}
      GUARDIAN_API_KEY: ${GUARDIAN_API_KEY}
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY}
      PRODUCTHUNT_TOKEN: ${PRODUCTHUNT_TOKEN}
      PYTHON_BIN: ${PYTHON_BIN}
      STARTUP_CATCHUP_ENABLED: ${STARTUP_CATCHUP_ENABLED:-true}
      STARTUP_CATCHUP_URL: ${STARTUP_CATCHUP_URL:-http://127.0.0.1:3000/api/internal/jobs/daily-sync}
      RUN_DB_MIGRATIONS_ON_STARTUP: ${RUN_DB_MIGRATIONS_ON_STARTUP:-true}
      WEB_STARTUP_HEALTH_RETRIES: ${WEB_STARTUP_HEALTH_RETRIES:-60}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - ./scripts/news_collector/data:/app/scripts/news_collector/data
      - ./scripts/news_collector/output:/app/scripts/news_collector/output
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  scheduler:
    build: .
    restart: unless-stopped
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DAILY_SYNC_CRON: ${DAILY_SYNC_CRON}
      APP_TIMEZONE: ${APP_TIMEZONE}
    volumes:
      - ./logs/scheduler:/var/log/news-app
    command: ["sh", "/app/scripts/scheduler-entrypoint.sh"]
    depends_on:
      web:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signal_desk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
